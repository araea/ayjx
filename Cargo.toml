[package]
name = "ayjx"
version = "0.1.0"
edition = "2024"

[dependencies]
# 错误处理
anyhow = "1.0"

# 文本处理
jieba-rs = "0.10"     # 中文分词
regex = "1.12"        # 正则表达式
pulldown-cmark = "0.13" # Markdown 解析

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.18"
toml = "1.1"

# 加密与哈希
md5 = "0.8"
base64 = "0.23"

# 网络与 HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "http2", "charset", "json", "multipart"] }
http = "1.4"
url = "2.5"
tokio-tungstenite = "0.30"  # WebSocket
quick-xml = "0.38"           # Satori 消息元素解析
async-openai = { version = "0.41", features = ["_api", "model", "chat-completion-types", "chat-completion"] }  # OpenAI API

# 异步运行时与工具
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# 数据库
sea-orm = { version = "2.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }

# 图像处理与生成
image = "0.25"
plotters = { version = "0.3", default-features = false, features = ["all_elements", "all_series", "bitmap_backend", "bitmap_encoder", "bitmap_gif", "chrono", "colormaps", "deprecated_items", "full_palette", "image", "svg_backend", "ab_glyph"] }         # 图表绘制
ab_glyph = "0.2"      # 原生文字光栅化（词意卡片）
fontdb = "0.24"       # 字体处理
araea-wordcloud = "0.1"   # 词云生成
cdp-html-shot = "0.2.8"     # HTML 截图

# 时间与随机数
chrono = "0.4"
rand = "0.10"
