<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>ayjx 控制台</title>
<style>
:root{
  --bg:#070a0f; --bg2:#0b0f16; --card:#10151e; --card2:#141b26;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.14);
  --ink:#f2f5f8; --ink2:#9fb0c4; --ink3:#6b7c92;
  --accent:#5de6c9; --accent-dim:rgba(93,230,201,.14); --accent-line:rgba(93,230,201,.34);
  --warn:#f0b25c; --warn-dim:rgba(240,178,92,.15);
  --bad:#f2777f; --bad-dim:rgba(242,119,127,.15);
  --off:#5d6b7e;
  --r:12px; --r2:9px;
  --shadow:0 18px 46px rgba(0,0,0,.45);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="light"]{
  --bg:#eef1f6; --bg2:#e6eaf1; --card:#ffffff; --card2:#f6f8fb;
  --line:rgba(16,24,38,.10); --line2:rgba(16,24,38,.18);
  --ink:#131a24; --ink2:#4c5a6c; --ink3:#7b8798;
  --accent:#0e9c86; --accent-dim:rgba(14,156,134,.12); --accent-line:rgba(14,156,134,.32);
  --warn:#a5670a; --warn-dim:rgba(165,103,10,.12);
  --bad:#c23b46; --bad-dim:rgba(194,59,70,.10);
  --off:#94a1b2;
  --shadow:0 14px 34px rgba(21,32,48,.12);
}
*{box-sizing:border-box}
/* .gate 与 #app 都有自己的 display，光靠 hidden 属性盖不住它们 */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
code,kbd{font-family:var(--mono)}
::selection{background:var(--accent-dim)}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;border-radius:6px}

/* ================= 骨架 ================= */
#app{display:flex;flex-direction:column;height:100%}
.bar{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:linear-gradient(180deg,var(--bg2),rgba(0,0,0,0));
  border-bottom:1px solid var(--line);position:relative;z-index:5;
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{font-size:16px;letter-spacing:.4px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);align-self:center}
.brand small{color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bar .grow{flex:1 1 auto}
.stat{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.iconbtn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink2);border:1px solid transparent;font-size:15px;
}
.iconbtn:hover{background:var(--card2);color:var(--ink);border-color:var(--line)}

.wrap{flex:1 1 auto;display:flex;min-height:0}
.side{
  width:326px;flex:0 0 326px;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg2);
}
.search{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.search .box{position:relative;display:flex;align-items:center}
.search .box span{position:absolute;left:11px;color:var(--ink3);font-size:13px;pointer-events:none}
.search input{
  width:100%;padding:9px 30px 9px 30px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);
}
.search input::placeholder{color:var(--ink3)}
.search .clear{position:absolute;right:6px;width:22px;height:22px;border-radius:6px;color:var(--ink3);display:none}
.search input:not(:placeholder-shown)~.clear{display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:999px;font-size:12.5px;color:var(--ink2);
  border:1px solid var(--line);background:var(--card);white-space:nowrap;
}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
html[data-theme="light"] .chip[aria-pressed="true"]{color:#fff}

.list{flex:1 1 auto;overflow:auto;padding:4px 8px 24px;scrollbar-width:thin}
.grouphead{
  display:flex;align-items:center;gap:8px;padding:14px 8px 6px;
  font-size:11.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;
}
.grouphead i{flex:1 1 auto;height:1px;background:var(--line);font-style:normal}
.row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;border-radius:var(--r2);border:1px solid transparent;
}
.row:hover{background:var(--card)}
.row[aria-current="true"]{background:var(--card);border-color:var(--line2)}
.row .led{width:7px;height:7px;border-radius:50%;background:var(--off);flex:0 0 auto;transition:.18s}
.row.on .led{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.row .txt{flex:1 1 auto;min-width:0}
.row .nm{display:block;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ky{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .nm{color:var(--ink2)}
.row .mark{font-size:10.5px;color:var(--warn);background:var(--warn-dim);padding:2px 6px;border-radius:6px;flex:0 0 auto}

/* 开关 */
.sw{width:38px;height:22px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 auto;transition:.2s;border:1px solid transparent}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sw[data-busy="1"]{opacity:.5;pointer-events:none}
.sw.lg{width:46px;height:26px}
.sw.lg::after{width:20px;height:20px}
.sw.lg[aria-checked="true"]::after{transform:translateX(20px)}

/* ================= 详情 ================= */
.main{flex:1 1 auto;min-width:0;overflow:auto;scrollbar-width:thin}
.pad{max-width:820px;margin:0 auto;padding:22px 22px 90px}
.back{display:none;align-items:center;gap:6px;color:var(--ink2);font-size:13px;margin-bottom:12px}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.head h1{margin:0;font-size:23px;line-height:1.25;letter-spacing:.2px}
.head .keychip{
  font-family:var(--mono);font-size:12px;color:var(--accent);
  background:var(--accent-dim);border:1px solid var(--accent-line);
  padding:2px 8px;border-radius:7px;vertical-align:3px;margin-left:9px;white-space:nowrap;
}
.head .sw{margin-top:5px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
.badge{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.badge.warn{color:var(--warn);border-color:var(--warn-dim);background:var(--warn-dim)}
.badge.acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}
.summary{color:var(--ink2);margin:12px 0 0;font-size:14px;line-height:1.65}

.tabs{display:flex;gap:2px;margin:20px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:9px 14px;color:var(--ink3);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink2)}

.group{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:12px;overflow:hidden}
.group>summary{
  list-style:none;cursor:pointer;padding:12px 15px;display:flex;align-items:center;gap:9px;
  font-size:13px;color:var(--ink2);background:var(--card2);
}
.group>summary::-webkit-details-marker{display:none}
.group>summary .caret{transition:.2s;color:var(--ink3);font-size:11px}
.group[open]>summary .caret{transform:rotate(90deg)}
.group>summary code{color:var(--ink);font-size:12.5px}
.group .inner{padding:2px 0}

.field{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.field:first-child{border-top:0}
.field .meta{flex:1 1 auto;min-width:0}
.field .name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field .name b{font-weight:600;font-size:14px}
.field .name code{font-size:11.5px;color:var(--ink3)}
.field .sub{color:var(--ink3);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field .sub .def{font-family:var(--mono)}
.field .ctrl{flex:0 0 auto;display:flex;align-items:center;gap:8px;max-width:52%}
.field.wide{flex-direction:column;gap:10px}
.field.wide .ctrl{max-width:none;width:100%;align-items:stretch;flex-direction:column}
.field.dirty{background:linear-gradient(90deg,var(--accent-dim),transparent 55%)}
.field.bad{background:linear-gradient(90deg,var(--bad-dim),transparent 55%)}
.field .err{color:var(--bad);font-size:12px;margin-top:5px}
.reset{
  font-size:11.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:7px;padding:3px 8px;opacity:0;transition:.15s;
}
.field:hover .reset,.field.dirty .reset,.reset:focus-visible{opacity:1}
.reset:hover{color:var(--accent);border-color:var(--accent-line)}

input.txt,select.txt,textarea.txt{
  background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
  padding:7px 10px;width:190px;color:var(--ink);transition:border-color .15s;
}
input.txt:focus,select.txt:focus,textarea.txt:focus{border-color:var(--accent-line);outline:none}
input.num{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
textarea.txt{width:100%;min-height:120px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
.saving{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{color:var(--accent);font-size:13px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* 标签数组 */
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:8px;
  background:var(--card2);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;
}
.tag button{color:var(--ink3);width:18px;height:18px;border-radius:5px;line-height:1}
.tag button:hover{color:var(--bad);background:var(--bad-dim)}
.tags input{
  background:none;border:0;padding:4px 2px;min-width:104px;flex:1 1 104px;font-family:var(--mono);font-size:12.5px;
}
.tags input:focus{outline:none}
.tagbox{
  display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line2);
  border-radius:9px;background:var(--bg2);width:100%;
}
.tagbox:focus-within{border-color:var(--accent-line)}
.emptyhint{color:var(--ink3);font-size:12px;padding:2px}

.tools{display:flex;gap:8px;align-items:center;margin:-2px 0 14px}
.tools input{flex:1 1 auto;width:auto}
.tools .chip[aria-pressed="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
html[data-theme="light"] .tools .chip[aria-pressed="true"]{color:#fff}
select.txt{cursor:pointer;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.txt option{background:var(--card);color:var(--ink)}
.cmd{display:flex;gap:12px;padding:11px 15px;border-top:1px solid var(--line);align-items:baseline}
.cmd:first-child{border-top:0}
.cmd code{font-size:13px;color:var(--accent);white-space:nowrap}
.cmd code .ph{color:var(--warn)}
.cmd code .alias{color:var(--ink3)}
.cmd .note{color:var(--ink2);font-size:13px;flex:1 1 auto}
.difline{padding:9px 15px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--ink2);word-break:break-all}
.difline:first-child{border-top:0}
.empty{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}
.danger{margin-top:22px;display:flex;justify-content:flex-end}
.danger button{font-size:12.5px;color:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.danger button:hover{color:var(--bad);border-color:var(--bad-dim);background:var(--bad-dim)}

/* ================= 提示 ================= */
.toasts{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.toast{
  background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--accent);
  border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);font-size:13px;line-height:1.5;
  animation:rise .22s cubic-bezier(.2,.9,.3,1);color:var(--ink2);
}
.toast.bad{border-left-color:var(--bad)}
.toast b{color:var(--ink);display:block;margin-bottom:2px;font-size:13px}
@keyframes rise{from{transform:translateY(10px);opacity:0}}

/* ================= 登录 ================= */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:22px}
.gate .box{width:min(400px,100%);text-align:center}
.gate h2{margin:0 0 6px;font-size:19px}
.gate p{color:var(--ink3);font-size:13px;line-height:1.7;margin:0 0 18px}
.gate input{width:100%;text-align:center;font-family:var(--mono);letter-spacing:.08em}
.gate button.go{margin-top:10px;width:100%;padding:10px;border-radius:10px;background:var(--accent);color:#04120f;font-weight:600}
.gate .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:18px}

/* ================= 窄屏 ================= */
@media (max-width:880px){
  .side{position:absolute;inset:0;top:0;width:100%;flex:1 1 auto;z-index:3;border-right:0}
  .main{width:100%}
  .wrap{position:relative}
  body[data-view="detail"] .side{display:none}
  body[data-view="list"] .main{display:none}
  .back{display:flex}
  .pad{padding:18px 16px 90px}
  .field{flex-direction:column;gap:9px;align-items:stretch}
  .field .ctrl{max-width:none;justify-content:flex-start}
  .reset{opacity:1}
  .bar .stat.hide-sm{display:none}
  input.txt,select.txt{width:100%}
}

/* 阅读与触控：同一套布局适配桌面、手机和系统动效偏好。 */
html{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
:root{--bg:#0c1118;--bg2:#101720;--card:#161e29;--card2:#1b2532;--ink3:#93a3b7;--r:16px;--r2:12px}
html[data-theme="light"]{--bg:#f5f7fa;--bg2:#edf1f5;--card:#fff;--card2:#f7f9fb;--ink3:#5d6d80;--accent:#087e6c}
body{height:100dvh}button,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}button:disabled{cursor:wait;opacity:.55}
.bar{padding:14px 22px;padding-top:calc(14px + env(safe-area-inset-top));background:var(--bg2)}
.iconbtn{width:40px;height:40px}.brand b{font-size:20px;letter-spacing:-.6px}
.side{width:304px;flex-basis:304px}.search{padding:20px 16px 12px}.search input{min-height:44px}
.chip{min-height:34px}.list{padding:0 12px 24px}.row{padding:0;gap:8px;margin:3px 0}
.row[aria-current="true"]{border-color:var(--accent-line);background:var(--accent-dim)}
.rowlink{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:12px 10px}
.row>.sw{margin-right:10px}.row .txt{background:none;border:0;padding:0;width:auto}
.pad{max-width:960px;padding:34px 32px 120px}.head h1{font-size:29px;letter-spacing:-.5px}
.head h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head .keychip{margin:0}
.summary{max-width:72ch;line-height:1.8}.group{margin-bottom:18px}.field{padding:18px 20px;align-items:center}
.field .ctrl{flex:0 1 44%;width:44%;min-width:0}.field .ctrl>.txt{width:100%}
.field .ctrl>.sw{margin-left:auto}.field .name code,.group>summary code{overflow-wrap:anywhere;min-width:0}
.field .sub{line-height:1.7}.field.wide{align-items:stretch}.field.wide .ctrl{width:100%}.field .ctrl:has(textarea){width:100%}
.field.pending{box-shadow:inset 3px 0 var(--warn)}.field.bad{box-shadow:inset 3px 0 var(--bad)}
.field-status{font-size:12px;margin-top:6px;color:var(--warn);overflow-wrap:anywhere}.field-status:empty{display:none}
.field.bad .field-status{color:var(--bad)}
input.txt,select.txt{min-height:42px}textarea.txt{min-height:140px;font-size:13px}
.tagbox input{background:transparent;border:0;padding:8px;min-width:100px;flex:1;width:100px;outline:none}
.tag button{width:30px;height:30px}.tag{max-width:100%;overflow-wrap:anywhere}.tag>span{min-width:0}
.group .group{margin:10px;border-radius:10px}.group>summary{min-height:48px;flex-wrap:wrap}
.cmd{flex-wrap:wrap}.cmd code{white-space:normal;overflow-wrap:anywhere}.cmd .note{min-width:160px}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0;margin-top:-12px}
.savebar{display:flex;gap:12px;align-items:center;padding:10px 22px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);font-size:12px;flex-wrap:wrap}
.savebar .grow{flex:1}.save-state{color:var(--accent)}.save-state[data-tone="bad"]{color:var(--bad)}.save-state[data-tone="pending"]{color:var(--warn)}
.connection{color:var(--ink3)}.connection[data-offline="true"]{color:var(--bad)}.save-help{color:var(--ink3)}
.editor-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}.editor-wrap{width:100%}.editor-wrap>input.txt:not(.num){width:100%}.editor-wrap>input.num{display:block;margin-left:auto}
.toasts{bottom:82px}.gate .box{padding:30px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
@media(min-width:1400px){.pad{padding-top:48px}.side{width:330px;flex-basis:330px}}
@media(max-width:880px){.side{width:100%}.pad{padding:20px 16px 80px}.bar{padding-left:16px;padding-right:16px;gap:6px}.brand small{display:none}.back{min-height:40px}.field{padding:16px;align-items:stretch}.field .ctrl{width:100%;flex-basis:auto;max-width:none}.field .ctrl>.sw{margin-left:0}.head h1{font-size:25px}.savebar{padding-left:16px;padding-right:16px;gap:8px}.save-help{display:none}input,textarea,select,input.txt,textarea.txt{font-size:16px}.sw{width:44px;height:28px}.sw::after{width:22px;height:22px}.sw[aria-checked="true"]::after{transform:translateX(16px)}.tools{flex-wrap:wrap}.tools input{min-width:150px}}
@media(max-width:880px){.field:has(>.ctrl>.sw){flex-direction:row;align-items:center}.field:has(>.ctrl>.sw)>.ctrl{width:auto;flex:0 0 auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-view="list">
<div id="app" hidden>
  <header class="bar">
    <div class="brand"><span class="dot"></span><b>ayjx</b><small>控制台</small></div>
    <div class="grow"></div>
    <div class="stat hide-sm">前缀 <b id="s-prefix">/</b></div>
    <div class="stat">插件 <b id="s-count">0/0</b></div>
    <button class="iconbtn" id="theme" title="切换明暗">◐</button>
    <button class="iconbtn" id="refresh" title="刷新">⟳</button>
  </header>

  <div class="wrap">
    <nav class="side" aria-label="插件导航">
      <div class="search">
        <label class="box">
          <span>⌕</span>
          <input id="q" aria-label="搜索插件、指令或配置项" placeholder="搜索插件、指令或配置项" autocomplete="off" spellcheck="false">
          <button class="clear" id="qclear" title="清空">✕</button>
        </label>
        <div class="chips" id="filters">
          <button class="chip" data-f="all" aria-pressed="true">全部</button>
          <button class="chip" data-f="on" aria-pressed="false">已启用</button>
          <button class="chip" data-f="off" aria-pressed="false">已关闭</button>
          <button class="chip" data-f="diff" aria-pressed="false">已改动</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </nav>
    <main class="main" id="main"><div class="pad" id="detail"></div></main>
  </div>
  <footer class="savebar">
    <span id="connection" class="connection" role="status">正在连接…</span>
    <span class="grow"></span>
    <span class="save-help">编辑后自动保存 · Ctrl / ⌘ + S 立即保存</span>
    <span id="save-state" class="save-state" role="status" aria-live="polite">所有修改已保存</span>
    <button class="chip" id="save-all" hidden>立即保存</button>
  </footer>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <div class="brand" style="justify-content:center;margin-bottom:14px"><span class="dot"></span><b>ayjx</b><small>控制台</small></div>
    <h2>需要访问密钥</h2>
    <p>密钥写在 config.toml 的 <code>[webui] token</code> 里，<br>也可以在私聊或本机控制台发送 <code>webui</code> 取回带密钥的链接。</p>
    <input class="txt" id="key" type="password" aria-label="访问密钥" placeholder="粘贴访问密钥" autocomplete="off" spellcheck="false">
    <button class="go" id="enter">进入</button>
    <div class="err" id="gate-err" role="alert"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const TOKEN_KEY = "ayjx.webui.token", THEME_KEY = "ayjx.webui.theme", LAST_KEY = "ayjx.webui.last";
const store = { get(k){ try { return localStorage.getItem(k); } catch (_) { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch (_) {} } };

/* 框架级配置键的中文说明。只收录含义与插件无关的那些——
   拿不准的一律只显示原键名，宁可少说，不可说错。 */
const LABELS = {
  image_enabled:"输出为卡片图", image_scale:"出图倍率", channel:"群名单", white:"白名单",
  black:"黑名单", groups:"推送群", admins:"管理员", probability:"触发概率",
  cooldown_seconds:"冷却时间", enabled:"启用", debug:"调试日志", width:"宽度", height:"高度",
  limit:"数量上限", token:"访问密钥", bind:"监听地址", port:"端口", public_url:"对外地址",
  font_path:"字体文件", font_family:"字体名称", retention_days:"保留天数",
  request_timeout_seconds:"请求超时", timeout_seconds:"超时", quality:"图片质量",
  max_chars:"字数上限", min_times:"触发次数", time:"执行时刻",
  viewport_width:"浏览器视口宽度", device_scale_factor:"截图倍率", max_height:"最大高度",
  ignore_domains:"忽略的域名", interrupt_texts:"打断语", interrupt_probability:"打断概率",
  allow_same_user:"允许同一人连续触发", allow_media:"允许图片与表情", ignore_commands:"跳过指令",
  max_delay_ms:"最大响应延迟", ambient:"群聊搭话", pi_control:"允许 Pi 管理配置",
  group_preferences:"各群偏好", card_theme:"卡片主题", mode:"模式", category:"分类"
};
const label = (key) => LABELS[key] || key;

/* ================= 会话与保存队列 ================= */
let TOKEN = null, STATE = null, CURRENT = null, TAB = "config";
let filter = "all", query = "", busy = 0, poller = null, bound = false;
let fieldQuery = "", onlyChanged = false, polling = false, starting = false, composing = false;
let queue = Promise.resolve(), lastSaved = "", connected = false;
// 草稿只留在当前页面内存，切换插件、筛选或刷新状态不会丢失，也不把密钥写入草稿存储。
const drafts = new Map();
const draftKey = (name, path) => name + ":" + path;
const pick = name => name && STATE.plugins.some(p => p.name === name) ? name : null;
const hashPlugin = () => { try { return decodeURIComponent((location.hash.match(/^#p=(.+)$/) || [])[1] || ""); } catch (_) { return ""; } };
const plugin = name => STATE.plugins.find(p => p.name === name);
const currentField = (name, path) => flatten(plugin(name).fields).find(f => f.path === path);
const editing = () => document.activeElement?.matches("#detail input, #detail textarea, #detail select");

function connection(ok){
  connected = ok;
  $("#connection").textContent = ok ? "已连接 · 自动同步" : "连接中断 · 草稿已保留";
  $("#connection").dataset.offline = String(!ok);
}
function status(){
  const entries = [...drafts.values()];
  const failed = entries.filter(d => d.error).length;
  const state = $("#save-state");
  state.dataset.tone = failed ? "bad" : entries.length || busy ? "pending" : "saved";
  state.textContent = busy ? "正在保存…" : failed ? failed + " 项待处理" : entries.length ? entries.length + " 项待保存" : lastSaved ? "已保存 · " + lastSaved : "所有修改已保存";
  $("#save-all").hidden = !entries.length;
  $("#save-all").textContent = failed ? "重试保存" : "立即保存";
  $("#save-all").disabled = !!busy;
  document.querySelectorAll(".row[data-plugin]").forEach(row => {
    const mark = $(".draft-mark", row);
    const count = entries.filter(d => d.name === row.dataset.plugin).length;
    if (mark) { mark.hidden = !count; mark.textContent = count + " 待保存"; }
  });
  document.querySelectorAll(".field[data-path]").forEach(row => {
    const d = drafts.get(draftKey(row.dataset.plugin, row.dataset.path));
    row.classList.toggle("pending", !!d);
    row.classList.toggle("bad", !!d?.error);
    const note = $(".field-status", row);
    if (note) note.textContent = d ? d.error || (d.saving ? "正在写入配置…" : d.manual ? "草稿未保存 · 点击保存或按 Ctrl / ⌘ + S" : "等待自动保存…") : "";
    row.querySelectorAll("input,textarea,select").forEach(input => input.setAttribute("aria-invalid", String(!!d?.error)));
  });
}
function apply(state){
  STATE = state;
  $("#s-prefix").textContent = state.prefix || "（无）";
  $("#s-count").textContent = state.summary.enabled + "/" + state.summary.total;
}

function gate(message){
  clearInterval(poller);
  $("#app").hidden = true; $("#gate").hidden = false;
  $("#gate-err").textContent = message || "";
  const input = $("#key"); input.focus();
  const submit = () => {
    if (starting || !input.value.trim()) return;
    TOKEN = input.value.trim(); start();
  };
  $("#enter").onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) submit(); };
}
async function api(path, options){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(path, { ...options, cache: "no-store", signal: controller.signal,
      headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" } });
    if (res.status === 401) {
      store.set(TOKEN_KEY, ""); TOKEN = null;
      gate("密钥已失效，请重新输入。未保存的草稿仍保留在本页。");
      throw new Error("密钥无效");
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "请求失败（" + res.status + "）");
    connection(true);
    return data;
  } catch (e) {
    connection(false);
    if (e.name === "AbortError") throw new Error("请求超时，结果尚未确认；请重试保存");
    throw e;
  } finally { clearTimeout(timeout); }
}
async function start(){
  if (starting) return;
  starting = true; $("#enter").disabled = true;
  try {
    const data = await api("/api/state");
    store.set(TOKEN_KEY, TOKEN); $("#key").value = "";
    $("#gate").hidden = true; $("#app").hidden = false;
    apply(data.state);
    const first = STATE.plugins.find(p => p.fields.length) || STATE.plugins[0];
    const linked = pick(hashPlugin());
    CURRENT = linked || pick(CURRENT) || pick(store.get(LAST_KEY)) || first?.name;
    if (linked) document.body.dataset.view = "detail";
    render(); bind(); watch();
  } catch (e) { gate("连接失败：" + e.message); }
  finally { starting = false; $("#enter").disabled = false; }
}
async function refresh(force = false){
  if (polling || busy || !TOKEN || !STATE || document.hidden || composing) return;
  polling = true;
  const revision = STATE.version;
  try {
    const data = force ? null : await api("/api/version");
    if (force || data.version !== STATE.version) {
      const next = await api("/api/state");
      // 读请求期间发生过写入时，丢弃旧快照，下一轮再同步。
      if (!busy && STATE.version === revision) { apply(next.state); refreshView(); }
    }
  } catch (e) { if (force) toast(e.message, true); }
  finally { polling = false; }
}
function watch(){ clearInterval(poller); poller = setInterval(() => refresh(), 4000); }
// 正在编辑的控件保持原 DOM、焦点、光标、输入法和撤销历史。
function refreshView(){
  if (!STATE) return;
  renderList();
  if (!editing() && !composing) renderDetail();
  document.querySelectorAll(".sw[data-plugin]").forEach(sw => {
    const p = plugin(sw.dataset.plugin);
    const value = sw.dataset.path ? currentField(p.name, sw.dataset.path)?.value : p.enabled;
    sw.setAttribute("aria-checked", String(!!value));
  });
  status();
}
function send(command){
  busy++; status();
  const task = queue.then(async () => {
    if (!TOKEN) throw new Error("请先重新输入访问密钥");
    const data = await api("/api/command", { method: "POST", body: JSON.stringify(command) });
    apply(data.state);
    if (!data.ok) throw new Error(data.message);
    lastSaved = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    // 修改面板自身密钥后继续使用新凭据，避免下一次轮询把维护者踢出。
    if (command.name === "webui" && command.path === "token" && command.action === "set") {
      TOKEN = command.value; store.set(TOKEN_KEY, TOKEN);
    }
    return true;
  });
  queue = task.catch(() => {});
  return task.finally(() => { busy--; status(); });
}
function draft(p, f, text, value, raw = false, error = "", manual = false){
  const key = draftKey(p.name, f.path), old = drafts.get(key);
  if (old) clearTimeout(old.timer);
  const d = { name:p.name, path:f.path, text, value, raw, error, manual,
    revision:(old?.revision || 0) + 1, saving:old?.saving || false, timer:null };
  drafts.set(key, d);
  if (!manual && !error && !composing) d.timer = setTimeout(() => saveDraft(key), 800);
  status(); return d;
}
async function saveDraft(key){
  const d = drafts.get(key);
  if (!d || d.saving || composing) return;
  clearTimeout(d.timer);
  if (d.invalid) { status(); return; }
  d.saving = true; d.error = ""; status();
  try {
    await send({ action:"set", name:d.name, path:d.path, value:d.value, raw:d.raw });
    if (drafts.get(key) === d) {
      drafts.delete(key);
      const input = [...document.querySelectorAll("[data-editor]")].find(input => input.dataset.editor === key);
      if (input && currentField(d.name, d.path).sensitive) input.value = "";
    }
  } catch (e) {
    if (drafts.get(key) === d) d.error = e.message;
  } finally {
    const next = drafts.get(key);
    if (next) next.saving = false;
    if (next && next !== d && !next.manual && !next.invalid) next.timer = setTimeout(() => saveDraft(key), 0);
    refreshView();
  }
}
function saveAll(){
  if (composing) return;
  document.querySelectorAll("#detail [data-flush]").forEach(input => input.dispatchEvent(new Event("change")));
  for (const key of drafts.keys()) saveDraft(key);
}
async function action(command){
  try { await send(command); toast("配置已写入并保存"); }
  catch (e) { toast(e.message, true); }
  finally { refreshView(); }
}
function discard(key){
  const d = drafts.get(key);
  if (d?.saving) return;
  if (d) clearTimeout(d.timer);
  drafts.delete(key); status();
}

function toast(text, bad){
  if (!text) return;
  const box = el("div", "toast" + (bad ? " bad" : ""));
  const lines = String(text).split("\n").filter(Boolean);
  box.appendChild(el("b", null, bad ? "未完成" : "已保存"));
  box.appendChild(document.createTextNode(lines.join(" ")));
  $("#toasts").appendChild(box);
  const life = bad ? 7000 : 3200;
  const kill = () => { box.style.opacity = "0"; box.style.transition = "opacity .2s"; setTimeout(() => box.remove(), 220); };
  box.onclick = kill;
  setTimeout(kill, life);
}

/* ================= 侧栏 ================= */
function matches(p){
  if (filter === "on" && !p.enabled) return false;
  if (filter === "off" && p.enabled) return false;
  if (filter === "diff" && !p.diff.length) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  if (p.name.toLowerCase().includes(q) || p.display.includes(query) || p.summary.toLowerCase().includes(q)) return true;
  if (p.commands.some(c => c.cmd.toLowerCase().includes(q) || c.note.includes(query))) return true;
  return flatten(p.fields).some(f => f.path.toLowerCase().includes(q) || label(f.key).toLowerCase().includes(q) || f.hint.toLowerCase().includes(q));
}
function flatten(fields){
  const out = [];
  const walk = (list) => list.forEach(f => { out.push(f); if (f.children.length) walk(f.children); });
  walk(fields); return out;
}

function renderList(){
  const list = $("#list"), scroll = list.scrollTop;
  const focused = document.activeElement?.closest(".row");
  const focusName = focused?.dataset.plugin;
  const focusSwitch = document.activeElement?.classList.contains("sw");
  list.textContent = "";
  const shown = STATE.plugins.filter(matches);
  if (!shown.length) { list.appendChild(el("div", "empty", "没有匹配的插件")); return; }
  STATE.sections.forEach(section => {
    const items = shown.filter(p => p.section === section.code);
    if (!items.length) return;
    const head = el("div", "grouphead");
    head.appendChild(el("span", null, section.title));
    head.appendChild(el("i"));
    head.appendChild(el("span", null, String(items.length)));
    list.appendChild(head);
    items.forEach(p => list.appendChild(listRow(p)));
  });
  list.scrollTop = scroll;
  if (focusName) {
    const row = [...list.querySelectorAll(".row")].find(row => row.dataset.plugin === focusName);
    row?.querySelector(focusSwitch ? ".sw" : ".rowlink")?.focus({preventScroll:true});
  }
}

function listRow(p){
  const row = el("div", "row " + (p.enabled ? "on" : "off"));
  row.setAttribute("aria-current", String(p.name === CURRENT));
  row.dataset.plugin = p.name;
  const link = el("button", "rowlink");
  link.setAttribute("aria-current", p.name === CURRENT ? "page" : "false");
  link.appendChild(el("span", "led"));
  const txt = el("span", "txt");
  txt.appendChild(el("b", "nm", p.display));
  txt.appendChild(el("span", "ky", p.name));
  link.appendChild(txt);
  row.appendChild(link);
  if (p.pending) row.appendChild(el("span", "mark", "待重启"));
  else if (p.diff.length) row.appendChild(el("span", "mark", "已改"));
  const pending = el("span", "mark draft-mark");
  const count = [...drafts.values()].filter(d => d.name === p.name).length;
  pending.hidden = !count; pending.textContent = count + " 待保存"; row.appendChild(pending);
  row.appendChild(toggle(p, false));
  link.onclick = () => select(p.name);
  return row;
}

function toggle(p, large){
  const sw = el("button", "sw" + (large ? " lg" : ""));
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(p.enabled));
  sw.setAttribute("aria-label", (p.enabled ? "关闭 " : "启用 ") + p.display);
  sw.dataset.plugin = p.name;
  sw.disabled = p.name === "ctl";
  if (sw.disabled) sw.title = "保留配置管理入口";
  sw.onclick = async e => {
    e.stopPropagation(); sw.disabled = true;
    await action({ action:"toggle", name:p.name, on:!plugin(p.name).enabled });
    sw.disabled = p.name === "ctl";
  };
  return sw;
}

function select(name){
  CURRENT = name; TAB = "config"; fieldQuery = ""; onlyChanged = false; store.set(LAST_KEY, name);
  document.body.dataset.view = "detail";
  // 地址栏跟着走：刷新回到原处，浏览器的返回键也就成了「回到上一个插件」。
  if (hashPlugin() !== name) history.pushState(null, "", "#p=" + encodeURIComponent(name));
  render();
  $("#main").scrollTop = 0;
}

/* ================= 详情 ================= */
function render(){ renderList(); renderDetail(); status(); }

/* 重画表单而不夺走筛选框的焦点与光标 */
function redrawConfig(p, input){
  const at = input.selectionStart;
  renderDetail(); status();
  const next = $(".tools input");
  if (next) { next.focus(); next.setSelectionRange(at, at); }
}

function renderDetail(){
  const pad = $("#detail"); pad.textContent = "";
  const p = plugin(CURRENT);
  if (!p) { pad.appendChild(el("div", "empty", "选择左侧的一个插件开始")); return; }

  const back = el("button", "back");
  back.textContent = "‹ 插件列表";
  back.onclick = () => { document.body.dataset.view = "list"; };
  pad.appendChild(back);

  const head = el("div", "head");
  const title = el("div", null); title.style.flex = "1 1 auto";
  const h1 = el("h1", null, p.display);
  const key = el("code", "keychip", p.name);
  h1.appendChild(key);
  title.appendChild(h1);
  head.appendChild(title);
  head.appendChild(toggle(p, true));
  pad.appendChild(head);

  const badges = el("div", "badges");
  badges.appendChild(el("span", "badge", p.section_title));
  if (p.enabled) badges.appendChild(el("span", "badge acc", "已启用"));
  else badges.appendChild(el("span", "badge", "已关闭"));
  if (p.pending) badges.appendChild(el("span", "badge warn", "待重启生效"));
  else if (p.restart) badges.appendChild(el("span", "badge", "排期改动需重启"));
  if (p.diff.length) badges.appendChild(el("span", "badge acc", "已改 " + p.diff.length + " 项"));
  pad.appendChild(badges);
  pad.appendChild(el("p", "summary", p.summary));

  const tabs = el("div", "tabs");
  tabs.setAttribute("role", "tablist"); tabs.setAttribute("aria-label", "插件详情");
  [["config", "配置"], ["cmds", "指令 " + (p.commands.length || "")], ["diff", "差异 " + (p.diff.length || "")]]
    .forEach(([id, text]) => {
      const tab = el("button", "tab", text.trim());
      tab.setAttribute("role", "tab");
      tab.id = "tab-" + id; tab.tabIndex = TAB === id ? 0 : -1;
      tab.setAttribute("aria-controls", "tab-panel");
      tab.setAttribute("aria-selected", String(TAB === id));
      tab.onclick = () => { TAB = id; renderDetail(); status(); };
      tab.onkeydown = e => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
        e.preventDefault();
        const tabs = [...tab.parentNode.children];
        const at = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (tabs.indexOf(tab) + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
        tabs[at].click(); $(".tab[aria-selected=true]").focus();
      };
      tabs.appendChild(tab);
    });
  pad.appendChild(tabs);

  const panel = el("section"); panel.id = "tab-panel";
  panel.setAttribute("role", "tabpanel"); panel.setAttribute("aria-labelledby", "tab-" + TAB);
  pad.appendChild(panel);
  if (TAB === "config") renderConfig(panel, p);
  else if (TAB === "cmds") renderCmds(panel, p);
  else renderDiff(panel, p);
}

/* 一个字段能不能被这次筛选看见：自己命中，或者它的某个子项命中 */
function queryMatches(f){
  return !fieldQuery || f.path.toLowerCase().includes(fieldQuery) || label(f.key).toLowerCase().includes(fieldQuery) || f.hint.toLowerCase().includes(fieldQuery);
}
function fieldVisible(f, inherited = false){
  const hit = inherited || queryMatches(f);
  return (hit && (!onlyChanged || f.changed)) || f.children.some(child => fieldVisible(child, hit));
}

function renderConfig(pad, p){
  if (!p.fields.length) {
    pad.appendChild(box(el("div", "empty", "这个插件只有一个总开关，没有别的可调项。")));
    return;
  }

  // 配置项一多，翻找就成了主要成本；超过一屏才给筛选，少的时候不添乱
  const many = p.fields.length > 0;
  if (many) {
    const tools = el("div", "tools");
    const find = el("input", "txt");
    find.setAttribute("aria-label", "筛选配置名称、路径和说明"); find.placeholder = "筛选配置名称、路径和说明"; find.value = fieldQuery; find.spellcheck = false;
    find.oninput = () => { fieldQuery = find.value.trim().toLowerCase(); redrawConfig(p, find); };
    const only = el("button", "chip", "只看已改动");
    only.setAttribute("aria-pressed", String(onlyChanged));
    only.onclick = () => { onlyChanged = !onlyChanged; renderDetail(); status(); };
    tools.appendChild(find); tools.appendChild(only);
    pad.appendChild(tools);
  }

  const visible = p.fields.filter(f => fieldVisible(f));
  if (!visible.length) {
    pad.appendChild(box(el("div", "empty", onlyChanged ? "这个插件的配置与默认值完全一致。" : "没有匹配的配置项")));
    return;
  }
  const loose = visible.filter(f => f.kind !== "table");
  const tables = visible.filter(f => f.kind === "table");
  if (loose.length) {
    const group = box();
    loose.forEach(f => group.add(field(p, f)));
    pad.appendChild(group);
  }
  tables.forEach(f => pad.appendChild(tableGroup(p, f)));

  const danger = el("div", "danger");
  const reset = el("button", null, "恢复该插件全部默认值");
  reset.onclick = async () => {
    if (!confirm("将 " + p.display + " 的全部配置恢复为默认值？开关、管理员与面板密钥会保留。")) return;
    if ([...drafts.values()].some(d => d.name === p.name && d.saving)) return;
    for (const [key, d] of drafts) if (d.name === p.name) discard(key);
    await action({ action: "reset", name: p.name, path: "" });
  };
  danger.appendChild(reset);
  pad.appendChild(danger);
}

/* 一个带边框的卡片容器；内容往 .add() 里塞，外层的圆角与描边不被打断 */
function box(child){
  const group = el("div", "group");
  const inner = el("div", "inner");
  group.appendChild(inner);
  if (child) inner.appendChild(child);
  group.add = (node) => inner.appendChild(node);
  return group;
}

function tableGroup(p, f, inherited = false){
  inherited = inherited || queryMatches(f);
  const open = store.get("ayjx.open." + p.name + "." + f.path) !== "0";
  const details = el("details", "group");
  details.open = !!fieldQuery || onlyChanged || open;
  const summary = el("summary");
  summary.appendChild(el("span", "caret", "▶"));
  const text = label(f.key);
  summary.appendChild(el("b", null, text));
  if (f.path !== text) summary.appendChild(el("code", null, f.path));
  const changed = flatten([f]).filter(x => x !== f && x.changed).length;
  if (changed) summary.appendChild(el("span", "badge acc", changed + " 项已改"));
  details.appendChild(summary);
  const inner = el("div", "inner");
  f.children.filter(child => fieldVisible(child, inherited)).forEach(child => inner.appendChild(field(p, child, inherited)));
  if (!f.children.length) inner.appendChild(el("div", "empty", "空表"));
  details.appendChild(inner);
  details.ontoggle = () => { if (fieldQuery || onlyChanged) return; store.set("ayjx.open." + p.name + "." + f.path, details.open ? "1" : "0"); };
  return details;
}

function field(p, f, inherited = false){
  if (f.kind === "table") return tableGroup(p, f, inherited);
  const wide = f.kind === "raw" || f.kind.endsWith("_array") || (f.kind === "string" && !f.sensitive && (String(f.value || "").length > 70 || /prompt|persona|instruction/.test(f.key)));
  const row = el("div", "field" + (wide ? " wide" : "") + (f.changed ? " dirty" : ""));

  row.dataset.path = f.path; row.dataset.plugin = p.name;
  const meta = el("div", "meta");
  const name = el("div", "name");
  const text = label(f.key);
  name.appendChild(el("b", null, text));
  // 键名重复印两遍只是噪声：没有中文说法时，键名本身就是标题
  if (f.path !== text) name.appendChild(el("code", null, f.path));
  meta.appendChild(name);

  const sub = el("div", "sub");
  if (f.hint) sub.appendChild(el("span", null, f.hint));
  if (f.sensitive) sub.appendChild(el("span", null, f.filled ? "已设置（不显示）" : "未设置"));
  else sub.appendChild(el("span", "def", "默认 " + short(f.default)));
  if (f.changed && !f.sensitive) {
    const reset = el("button", "reset", "恢复默认");
    reset.onclick = async () => {
      const key = draftKey(p.name, f.path);
      if (drafts.get(key)?.saving) return;
      if (drafts.has(key) && !confirm("恢复默认会替换这一项的草稿，继续？")) return;
      discard(key); await action({ action:"reset", name:p.name, path:f.path });
    };
    sub.appendChild(reset);
  }
  meta.appendChild(sub);
  const note = el("div", "field-status");
  note.id = "note-" + p.name + "-" + f.path;
  note.setAttribute("aria-live", "polite"); meta.appendChild(note);
  row.appendChild(meta);

  const ctrl = el("div", "ctrl");
  ctrl.appendChild(control(p, f, row));
  ctrl.querySelectorAll("input,textarea,select").forEach(input => {
    input.setAttribute("aria-label", label(f.key) + " · " + f.path);
    input.setAttribute("aria-describedby", note.id);
  });
  row.appendChild(ctrl);
  return row;
}

function short(value){
  if (value === null || value === undefined) return "—";
  if (Array.isArray(value)) return value.length ? "[" + value.map(short).join(", ") + "]" : "[]";
  if (typeof value === "object") return "{…}";
  if (typeof value === "string") return value === "" ? '""' : (value.length > 26 ? value.slice(0, 26) + "…" : value);
  return String(value);
}

function control(p, f, row){
  const key = draftKey(p.name, f.path);
  const commit = (value, raw = false, text = value) => {
    draft(p, f, text, value, raw, "", true);
    saveDraft(key);
  };
  if (f.kind === "bool") {
    const sw = el("button", "sw");
    sw.dataset.plugin = p.name; sw.dataset.path = f.path;
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", String(!!f.value));
    sw.setAttribute("aria-label", label(f.key));
    sw.onclick = async () => {
      sw.disabled = true;
      commit(!currentField(p.name, f.path).value);
      await queue; sw.disabled = false;
    };
    return sw;
  }
  if (f.kind === "string" && f.options.length && !f.sensitive) {
    const sel = el("select", "txt");
    const value = drafts.get(key)?.value ?? f.value;
    const choices = f.options.includes(value) ? f.options : [value, ...f.options];
    choices.forEach(choice => {
      const opt = el("option", null, choice);
      opt.value = choice; opt.selected = choice === value; sel.appendChild(opt);
    });
    sel.onchange = () => commit(sel.value);
    return sel;
  }
  if (f.kind.endsWith("_array")) return tagEditor(p, f);

  const raw = f.kind === "raw";
  const numeric = f.kind === "int" || f.kind === "float";
  const multiline = raw || (row.classList.contains("wide") && f.kind === "string");
  const manual = raw || f.sensitive;
  const wrap = el("div", "editor-wrap");
  const input = el(multiline ? "textarea" : "input", "txt" + (numeric ? " num" : ""));
  // 用文本接收数字，保留非法/未完成输入，不让浏览器偷偷清空草稿。
  if (!multiline) input.type = f.sensitive ? "password" : "text";
  if (numeric) input.inputMode = f.kind === "int" ? "numeric" : "decimal";
  input.autocomplete = "off"; input.spellcheck = false;
  const base = () => {
    const now = currentField(p.name, f.path);
    return f.sensitive ? "" : raw ? now.raw_text ?? toToml(now.value) : String(now.value ?? "");
  };
  input.value = drafts.get(key)?.text ?? base();
  input.placeholder = f.sensitive ? (f.filled ? "已设置 · 输入新值后保存" : "输入密钥后保存") : raw ? "按 TOML 格式编辑，支持多行" : "";
  input.dataset.flush = "1"; input.dataset.editor = key;
  const update = () => {
    const text = input.value;
    if (text === base() && !drafts.get(key)?.saving) { discard(key); return; }
    const existing = drafts.get(key);
    if (existing && existing.text === text) {
      if (!manual && !existing.error && !existing.saving && !composing) {
        clearTimeout(existing.timer); existing.timer = setTimeout(() => saveDraft(key), 800);
      }
      return;
    }
    let value = text, error = "";
    if (numeric) {
      if (!text.trim()) error = "请输入数字，或按 Esc 恢复已保存值";
      else if (!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(text.trim()) || !Number.isFinite(Number(text))) error = "请输入有效数字";
      else if (f.kind === "int" && !Number.isSafeInteger(Number(text))) error = "请输入安全范围内的整数，不能包含小数";
      value = Number(text);
    }
    const d = draft(p, f, text, value, raw, error, manual);
    d.invalid = !!error;
  };
  input.oninput = update;
  input.onchange = () => { if (!composing) update(); };
  input.addEventListener("compositionstart", () => { composing = true; clearTimeout(drafts.get(key)?.timer); });
  input.addEventListener("compositionend", () => { composing = false; update(); });
  input.onblur = () => { if (!manual && !composing) saveDraft(key); };
  input.onkeydown = e => {
    if (e.isComposing || composing) return;
    if (e.key === "Escape") {
      e.stopPropagation(); e.preventDefault();
      if (!drafts.get(key)?.saving) { discard(key); input.value = base(); }
    } else if (e.key === "Enter" && !multiline) {
      e.preventDefault(); update(); saveDraft(key);
    }
  };
  wrap.appendChild(input);
  const bar = el("div", "editor-actions");
  if (manual) {
    const save = el("button", "chip", raw ? "保存 TOML" : "保存密钥");
    save.onclick = () => { update(); saveDraft(key); };
    bar.appendChild(save);
  }
  const undo = el("button", "chip", "撤销草稿");
  undo.onclick = () => {
    if (drafts.get(key)?.saving) return;
    discard(key); input.value = base();
  };
  if (manual || drafts.has(key)) bar.appendChild(undo);
  if (bar.children.length) wrap.appendChild(bar);
  return wrap;
}

// 后端提供原生 TOML 文本；此兜底使用内联表，避免子表改变后续根键的归属。
function toToml(value){
  const literal = v => {
    if (Array.isArray(v)) return "[" + v.map(literal).join(", ") + "]";
    if (v && typeof v === "object") return "{ " + Object.entries(v).map(([k, x]) => JSON.stringify(k) + " = " + literal(x)).join(", ") + " }";
    return JSON.stringify(v);
  };
  if (value && typeof value === "object" && !Array.isArray(value))
    return Object.entries(value).map(([k, v]) => JSON.stringify(k) + " = " + literal(v)).join("\n");
  return value == null ? "" : literal(value);
}

function tagEditor(p, f){
  const key = draftKey(p.name, f.path);
  const numeric = f.kind === "int_array" || f.kind === "float_array";
  const boolean = f.kind === "bool_array";
  const wrap = el("div", "editor-wrap");
  const boxEl = el("div", "tagbox");
  const input = el("input");
  input.placeholder = numeric ? "输入数字，回车添加" : boolean ? "true / false，回车添加" : "输入一项，回车添加";
  if (numeric) input.inputMode = "decimal";
  input.autocomplete = "off"; input.spellcheck = false;
  let values = (drafts.get(key)?.value ?? f.value ?? []).slice();
  input.value = drafts.get(key)?.entry || "";
  const mark = (error = "") => {
    if (!input.value && !error && !drafts.get(key)?.saving && JSON.stringify(values) === JSON.stringify(currentField(p.name, f.path).value)) {
      discard(key); return;
    }
    const d = draft(p, f, null, values.slice(), false, error, true);
    d.entry = input.value; d.invalid = !!error || !!input.value.trim();
    return d;
  };
  const paint = () => {
    boxEl.querySelectorAll(".tag").forEach(tag => tag.remove());
    values.forEach((value, index) => {
      const tag = el("span", "tag");
      tag.appendChild(el("span", null, String(value)));
      const kill = el("button", null, "×");
      kill.setAttribute("aria-label", "移除 " + value);
      // 点击删除时先处理尚未提交的输入，避免 blur 与 click 同时发出旧数组。
      kill.onpointerdown = e => e.preventDefault();
      kill.onclick = () => {
        if (input.value.trim()) { add(); if (input.value.trim()) return; }
        values.splice(index, 1); mark(); paint(); saveDraft(key);
      };
      tag.appendChild(kill); boxEl.insertBefore(tag, input);
    });
  };
  const add = () => {
    if (composing || !input.value.trim()) return;
    const text = input.value.trim();
    // 字符串中的空格和逗号可能是正文，整段作为一项保存；数字支持批量粘贴。
    const parts = numeric || boolean ? text.split(/[,，\s]+/).filter(Boolean) : [text];
    const added = [];
    for (const part of parts) {
      if (numeric) {
        const n = Number(part);
        if (!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(part) || !Number.isFinite(n) || (f.kind === "int_array" && !Number.isSafeInteger(n))) {
          mark("「" + part + "」不是有效的" + (f.kind === "int_array" ? "整数" : "数字")); return;
        }
        added.push(n);
      } else if (boolean) {
        if (part !== "true" && part !== "false") { mark("布尔数组只能填写 true 或 false"); return; }
        added.push(part === "true");
      } else added.push(part);
    }
    values.push(...added); input.value = ""; mark(); paint(); saveDraft(key);
  };
  input.oninput = () => mark();
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => { composing = false; mark(); });
  input.onkeydown = e => {
    if (e.isComposing || composing) return;
    if (e.key === "Enter") { e.preventDefault(); add(); }
    if (e.key === "Escape") {
      e.stopPropagation();
      if (!drafts.get(key)?.saving) {
        discard(key); values = currentField(p.name, f.path).value.slice(); input.value = ""; paint();
      }
    }
  };
  input.onblur = add; input.onchange = add; input.dataset.flush = "1";
  boxEl.appendChild(input); paint(); wrap.appendChild(boxEl);
  const bar = el("div", "editor-actions");
  const addButton = el("button", "chip", "添加"); addButton.onclick = add;
  const undo = el("button", "chip", "撤销草稿");
  undo.onclick = () => { if (!drafts.get(key)?.saving) { discard(key); values = currentField(p.name, f.path).value.slice(); input.value = ""; paint(); } };
  bar.append(addButton, undo); wrap.appendChild(bar);
  return wrap;
}

function renderCmds(pad, p){
  const group = el("div", "group");
  const inner = el("div", "inner");
  if (!p.commands.length) inner.appendChild(el("div", "empty", "这个插件在后台自动工作，没有需要手动触发的指令。"));
  p.commands.forEach(c => {
    const row = el("div", "cmd");
    const parts = c.cmd.split(" / ");
    const code = el("code");
    parts.forEach((part, index) => {
      if (index) { code.appendChild(el("span", "alias", "  ·  " + (c.prefixed ? STATE.prefix : "") + part)); return; }
      (c.prefixed ? STATE.prefix + part : part).split(/(<[^>]*>|\[[^\]]*\])/).forEach(piece => {
        if (!piece) return;
        code.appendChild(/^[<\[]/.test(piece) ? el("span", "ph", piece) : document.createTextNode(piece));
      });
    });
    row.appendChild(code);
    row.appendChild(el("div", "note", c.note));
    inner.appendChild(row);
  });
  group.appendChild(inner);
  pad.appendChild(group);
}

function renderDiff(pad, p){
  const group = el("div", "group");
  const inner = el("div", "inner");
  if (!p.diff.length) inner.appendChild(el("div", "empty", "配置与默认值完全一致。"));
  p.diff.forEach(line => inner.appendChild(el("div", "difline", line)));
  group.appendChild(inner);
  pad.appendChild(group);
}

/* ================= 交互绑定 ================= */
function bind(){
  if (bound) return;
  bound = true;
  const search = $("#q");
  search.oninput = () => { query = search.value.trim(); renderList(); };
  $("#qclear").onclick = () => { search.value = ""; query = ""; renderList(); search.focus(); };
  $("#filters").onclick = e => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    filter = chip.dataset.f;
    [...$("#filters").children].forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
    renderList();
  };
  $("#theme").onclick = () => {
    const theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = theme; store.set(THEME_KEY, theme);
  };
  $("#refresh").onclick = () => refresh(true);
  $("#save-all").onclick = saveAll;
  addEventListener("hashchange", () => {
    const name = pick(hashPlugin());
    if (name && name !== CURRENT) {
      CURRENT = name; TAB = "config"; fieldQuery = ""; onlyChanged = false;
      document.body.dataset.view = "detail"; render();
    } else if (!name) document.body.dataset.view = "list";
  });
  addEventListener("beforeunload", e => {
    if (drafts.size || busy) { e.preventDefault(); e.returnValue = ""; }
  });
  addEventListener("online", () => refresh(true));
  addEventListener("offline", () => connection(false));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  $("#detail").addEventListener("focusout", () => setTimeout(() => {
    if (!editing() && !busy && !composing) { renderDetail(); status(); }
  }, 0));
  document.addEventListener("keydown", e => {
    if (e.isComposing || composing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveAll(); }
    else if (e.key === "/" && !document.activeElement.matches("input,textarea,select")) {
      e.preventDefault(); document.body.dataset.view = "list"; search.focus(); search.select();
    } else if (e.key === "Escape" && !document.activeElement.matches("input,textarea,select")) {
      document.body.dataset.view = "list";
    }
  });
}

// 所有状态和函数准备好后启动；没有凭据时也能安全显示登录页。
(function boot(){
  document.documentElement.dataset.theme = store.get(THEME_KEY) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const url = new URL(location.href), k = url.searchParams.get("k");
  if (k) {
    TOKEN = k; url.searchParams.delete("k");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  } else TOKEN = store.get(TOKEN_KEY);
  TOKEN ? start() : gate();
})();
